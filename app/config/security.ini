; =============================================================================
; PHP SECURITY CONFIGURATION — MOCAPIC
; =============================================================================
; Este archivo se carga al iniciar PHP dentro del contenedor.
; Limita funciones peligrosas, desactiva exposición de versión, etc.
; =============================================================================

expose_php = Off
display_errors = On
error_reporting = E_ALL
allow_url_fopen = Off
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,curl_exec,curl_multi_exec,parse_ini_file,show_source
upload_max_filesize = 20M
post_max_size = 25M
max_execution_time = 60
memory_limit = 256M
