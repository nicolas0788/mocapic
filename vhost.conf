# =============================================================================
# VirtualHost para entorno Docker - Proyecto MOCAPIC
# =============================================================================
# Este archivo define:
#  - La carpeta pública del proyecto (DocumentRoot)
#  - Permisos para .htaccess (rutas limpias)
#  - Logs del servidor Apache
# =============================================================================

<VirtualHost *:80>
    DocumentRoot /var/www/html/app/public_html

    <Directory /var/www/html/app/public_html>
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
